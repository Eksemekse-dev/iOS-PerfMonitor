name: Build dylib Clang

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          xcrun --sdk iphoneos clang -dynamiclib \
            -arch arm64 \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            main.m \
            -o PerfMonitor.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerfMonitor-dylib
          path: PerfMonitor.dylib
