name: Build and Sign dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          xcrun --sdk iphoneos clang -dynamiclib \
            -arch arm64 \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            main.m \
            -o PerfMonitor.dylib

      - name: Sign dylib with ldid
        run: |
          # Sprawdzamy czy ldid jest dostępne, a jak nie, to instalujemy przez Homebrew
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi
          # Podpisujemy bibliotekę pseudo-podpisem (wymaganym przez iOS dla dylibów)
          ldid -S PerfMonitor.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerfMonitor-dylib
          path: PerfMonitor.dylib
